<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("Typescript")

    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('goLnag')

    // EDIT
    const scndLnag =  document.querySelector("li:nth-child(2)")
    // scndLnag.innerHTML = "MOJO"
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    scndLnag.replaceWith(newli)

    //EDIT
    const firstLnag = document.querySelector("li:first-child")
    firstLnag.outerHTML = '<li>Typescript</>'

    //REMOVE
    const lastLnag = document.querySelector('li:last-child')
    lastLnag.remove()

</script>
</html>
